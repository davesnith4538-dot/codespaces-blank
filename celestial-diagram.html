<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemical Celestial Diagram</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }
        
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        svg {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        .planet {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        .label {
            font-size: 24px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .orbit {
            fill: none;
            stroke: #333;
            stroke-width: 1.5;
            stroke-dasharray: 3, 3;
            opacity: 0.6;
        }
        
        .center-ornament {
            fill: none;
            stroke: #333;
            stroke-width: 2;
        }
        
        .star {
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 800" width="800" height="800">
            <!-- Background stars -->
            <g class="stars">
                <circle cx="100" cy="80" r="2" class="star"/>
                <circle cx="150" cy="120" r="1.5" class="star"/>
                <circle cx="200" cy="60" r="1" class="star"/>
                <circle cx="700" cy="100" r="1.5" class="star"/>
                <circle cx="750" cy="150" r="2" class="star"/>
                <circle cx="720" cy="70" r="1" class="star"/>
                <circle cx="100" cy="700" r="1.5" class="star"/>
                <circle cx="150" cy="750" r="2" class="star"/>
                <circle cx="700" cy="720" r="1.5" class="star"/>
                <circle cx="750" cy="700" r="1" class="star"/>
                <circle cx="80" cy="400" r="1.5" class="star"/>
                <circle cx="750" cy="400" r="1" class="star"/>
                <circle cx="400" cy="80" r="1.5" class="star"/>
                <circle cx="400" cy="750" r="2" class="star"/>
            </g>
            
            <!-- Orbital circles -->
            <circle cx="400" cy="400" r="280" class="orbit"/>
            <circle cx="400" cy="400" r="240" class="orbit"/>
            <circle cx="400" cy="400" r="200" class="orbit"/>
            <circle cx="400" cy="400" r="160" class="orbit"/>
            <circle cx="400" cy="400" r="120" class="orbit"/>
            
            <!-- Central ornament and face -->
            <g id="center">
                <!-- Main circle -->
                <circle cx="400" cy="400" r="115" fill="none" stroke="#333" stroke-width="3"/>
                
                <!-- Face with antlers and leaves -->
                <circle cx="400" cy="380" r="45" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
                
                <!-- Antlers/radiating lines -->
                <line x1="400" y1="330" x2="400" y2="300" stroke="#333" stroke-width="2"/>
                <line x1="385" y1="335" x2="370" y2="310" stroke="#333" stroke-width="1.5"/>
                <line x1="415" y1="335" x2="430" y2="310" stroke="#333" stroke-width="1.5"/>
                <line x1="375" y1="345" x2="355" y2="330" stroke="#333" stroke-width="1.5"/>
                <line x1="425" y1="345" x2="445" y2="330" stroke="#333" stroke-width="1.5"/>
                
                <!-- Central keyhole -->
                <circle cx="400" cy="415" r="8" fill="#333"/>
                <rect x="398" y="415" width="4" height="15" fill="#333"/>
                
                <!-- Decorative leaves at top -->
                <ellipse cx="380" cy="360" rx="12" ry="20" fill="none" stroke="#333" stroke-width="1.5"/>
                <ellipse cx="420" cy="360" rx="12" ry="20" fill="none" stroke="#333" stroke-width="1.5"/>
                <ellipse cx="400" cy="345" rx="14" ry="22" fill="none" stroke="#333" stroke-width="1.5"/>
                
                <!-- Face features -->
                <circle cx="385" cy="375" r="4" fill="#333"/>
                <circle cx="415" cy="375" r="4" fill="#333"/>
                <path d="M 380 400 Q 400 410 420 400" fill="none" stroke="#333" stroke-width="2"/>
            </g>
            
            <!-- Sun (top left) -->
            <g>
                <circle cx="150" cy="150" r="45" fill="#fff9e6" stroke="#333" stroke-width="2"/>
                <circle cx="150" cy="150" r="50" fill="none" stroke="#333" stroke-width="1.5"/>
                <line x1="150" y1="80" x2="150" y2="60" stroke="#333" stroke-width="2"/>
                <line x1="150" y1="220" x2="150" y2="240" stroke="#333" stroke-width="2"/>
                <line x1="80" y1="150" x2="60" y2="150" stroke="#333" stroke-width="2"/>
                <line x1="220" y1="150" x2="240" y2="150" stroke="#333" stroke-width="2"/>
                <line x1="95" y1="95" x2="80" y2="80" stroke="#333" stroke-width="1.5"/>
                <line x1="205" y1="205" x2="220" y2="220" stroke="#333" stroke-width="1.5"/>
                <line x1="205" y1="95" x2="220" y2="80" stroke="#333" stroke-width="1.5"/>
                <line x1="95" y1="205" x2="80" y2="220" stroke="#333" stroke-width="1.5"/>
                <text x="150" y="160" class="label">☉</text>
            </g>
            
            <!-- Moon (top right) -->
            <g>
                <circle cx="650" cy="150" r="45" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
                <path d="M 625 130 Q 635 150 625 170" fill="none" stroke="#333" stroke-width="3"/>
                <!-- Stars on moon -->
                <circle cx="630" cy="145" r="1.5" fill="#333"/>
                <circle cx="640" cy="155" r="1" fill="#333"/>
                <circle cx="645" cy="140" r="1.5" fill="#333"/>
                <text x="650" y="160" class="label">☽</text>
            </g>
            
            <!-- Left planets in vertical line -->
            <!-- Planet 5 (left upper) -->
            <g>
                <circle cx="120" cy="250" r="35" fill="#daa520" stroke="#333" stroke-width="2"/>
                <ellipse cx="120" cy="250" rx="37" ry="15" fill="none" stroke="#333" stroke-width="1.5"/>
                <circle cx="120" cy="250" r="15" fill="none" stroke="#333" stroke-width="1"/>
                <text x="120" y="257" class="label">5</text>
            </g>
            
            <!-- Planet 3 (left middle) -->
            <g>
                <circle cx="100" cy="400" r="38" fill="#8b7355" stroke="#333" stroke-width="2"/>
                <circle cx="100" cy="400" r="20" fill="none" stroke="#333" stroke-width="1"/>
                <circle cx="100" cy="400" r="30" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="100" y="410" class="label">3</text>
            </g>
            
            <!-- Planet 1 (bottom left) -->
            <g>
                <circle cx="150" cy="650" r="40" fill="#cd853f" stroke="#333" stroke-width="2"/>
                <ellipse cx="150" cy="650" rx="42" ry="18" fill="none" stroke="#333" stroke-width="1.5"/>
                <circle cx="150" cy="650" r="12" fill="none" stroke="#333" stroke-width="1"/>
                <text x="150" y="660" class="label">1</text>
            </g>
            
            <!-- Right planets in vertical line -->
            <!-- Planet 6 (right upper) -->
            <g>
                <circle cx="680" cy="250" r="35" fill="#b0c4de" stroke="#333" stroke-width="2"/>
                <circle cx="680" cy="250" r="20" fill="none" stroke="#333" stroke-width="1"/>
                <circle cx="680" cy="250" r="30" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="680" y="257" class="label">6</text>
            </g>
            
            <!-- Planet 4 (right middle) -->
            <g>
                <circle cx="700" cy="400" r="38" fill="#d3d3d3" stroke="#333" stroke-width="2"/>
                <ellipse cx="700" cy="400" rx="40" ry="20" fill="none" stroke="#333" stroke-width="1.5"/>
                <circle cx="700" cy="400" r="15" fill="none" stroke="#333" stroke-width="1"/>
                <text x="700" y="410" class="label">4</text>
            </g>
            
            <!-- Planet 2 (bottom right) -->
            <g>
                <circle cx="650" cy="650" r="40" fill="#4169e1" stroke="#333" stroke-width="2"/>
                <ellipse cx="650" cy="650" rx="42" ry="22" fill="none" stroke="#333" stroke-width="1.5"/>
                <text x="650" y="660" class="label">2</text>
            </g>
            
            <!-- Bottom planets (horizontal) -->
            <!-- Planet 7 (bottom center left) -->
            <g>
                <circle cx="300" cy="720" r="38" fill="#daa520" stroke="#333" stroke-width="2"/>
                <ellipse cx="300" cy="720" rx="40" ry="18" fill="none" stroke="#333" stroke-width="1.5"/>
                <circle cx="300" cy="720" r="12" fill="none" stroke="#333" stroke-width="1"/>
                <text x="300" y="730" class="label">7</text>
            </g>
            
            <!-- Planet 7 (bottom center right - Saturn with rings) -->
            <g>
                <circle cx="500" cy="720" r="38" fill="#f4a460" stroke="#333" stroke-width="2"/>
                <ellipse cx="500" cy="720" rx="45" ry="15" fill="none" stroke="#333" stroke-width="2"/>
                <circle cx="500" cy="720" r="15" fill="none" stroke="#333" stroke-width="1"/>
                <text x="500" y="730" class="label">7</text>
            </g>
            
            <!-- Top planet 7 -->
            <g>
                <circle cx="400" cy="100" r="35" fill="#a0522d" stroke="#333" stroke-width="2"/>
                <circle cx="400" cy="100" r="20" fill="none" stroke="#333" stroke-width="1"/>
                <circle cx="400" cy="100" r="28" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="400" y="110" class="label">7</text>
            </g>
            
            <!-- Central numbered labels (inside the main circle) -->
            <text x="400" y="300" class="label" style="font-size: 20px;">6</text>
            <text x="400" y="480" class="label" style="font-size: 20px;">2</text>
            <text x="350" y="430" class="label" style="font-size: 20px;">8</text>
            <text x="450" y="430" class="label" style="font-size: 20px;">2</text>
            <text x="400" y="460" class="label" style="font-size: 20px;">1</text>
            <text x="370" y="390" class="label" style="font-size: 20px;">5</text>
            <text x="430" y="390" class="label" style="font-size: 20px;">4</text>
            <text x="400" y="440" class="label" style="font-size: 18px;">0</text>
            
            <!-- Connecting lines to center -->
            <line x1="150" y1="150" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="650" y1="150" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="120" y1="250" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="100" y1="400" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="150" y1="650" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="680" cy="250" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="700" y1="400" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
            <line x1="650" y1="650" x2="400" y2="400" stroke="#333" stroke-width="1" opacity="0.3"/>
        </svg>
    </div>
</body>
</html>
